<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
(function () {
  "use strict";

  // ---- Streamlit custom-component protocol (same as browser_camera) ----
  function post(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  const ST = {
    ready: () => post("streamlit:componentReady", { apiVersion: 1 }),
    setHeight: (h) => post("streamlit:setFrameHeight", { height: h }),
    setValue: (v) => post("streamlit:setComponentValue", { value: v, dataType: "json" }),
  };

  // One key, on the app's own origin. It holds only the Supabase refresh
  // token of the account signed in on this browser.
  const KEY = "stress_app_refresh_token";
  let lastNonce = null;

  function read() {
    try { return window.localStorage.getItem(KEY) || ""; } catch (e) { return ""; }
  }
  function write(token) {
    try { window.localStorage.setItem(KEY, token); } catch (e) { /* storage blocked */ }
  }
  function clear() {
    try { window.localStorage.removeItem(KEY); } catch (e) { /* storage blocked */ }
  }

  // mode 'write': store args.token (never answers, so it never causes a rerun)
  // mode 'clear': forget the token, then answer like 'read'
  // mode 'read' : answer {nonce, token} once per nonce
  function onRender(args) {
    const mode = args.mode || "read";
    if (mode === "write") {
      if (args.token) write(args.token);
      return;
    }
    if (mode === "clear") clear();
    if (args.nonce !== lastNonce) {
      lastNonce = args.nonce;
      ST.setValue({ nonce: args.nonce, token: read() });
    }
  }

  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "streamlit:render") onRender(ev.data.args || {});
  });
  ST.ready();
  ST.setHeight(0);
})();
</script>
</body>
</html>
